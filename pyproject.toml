[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "dsp-analyzer-core"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "numpy",
  "scipy",
  "matplotlib",
  "pydantic",
  "python-multipart",
  "soundfile>=0.14.0",
  "ipykernel>=7.2.0",
]

[dependency-groups]
dev = ["pytest", "ruff", "mypy", "httpx"]

[tool.setuptools.packages.find]
include = ["core", "core.*"]

[tool.pytest.ini_options]
testpaths = ["core/dsp/tests"]
addopts = "-v"

[tool.ruff]
src = ["core", "apps/api"]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
