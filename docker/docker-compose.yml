services:
  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    volumes:
      - ../apps/api:/app
      - ../core/dsp:/app/core/dsp
    ports:
      - "8000:8000"
    command: uv run uvicorn main:app --reload --host 0.0.0.0 --port 8000
    environment:
      - PYTHONPATH=/app