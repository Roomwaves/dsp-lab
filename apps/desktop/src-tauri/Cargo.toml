[package]
name = "dsp-analyzer-desktop"
version = "0.1.0"
description = "DSP Analyzer Desktop App"
authors = ["you"]
edition = "2021"

[lib]
name = "dsp_analyzer_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dsp-rs = { path = "../../../core/dsp_rs" }

# Audio I/O — Issue #42 y #43
cpal = "0.15"
ringbuf = "0.4"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
